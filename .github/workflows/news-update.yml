# AUTOMATIC NEWS UPDATES
# Runs the NewScape news processing on GitHub's computers
# three times a day (8 AM, 2 PM and 8 PM UAE time),
# even when our laptops are off. It can also be started
# by hand from the Actions tab ("Run workflow").

name: NewScape news update

on:
  schedule:
    # GitHub uses UTC time. UAE time = UTC + 4.
    - cron: "17 4 * * *"    # 8:17 AM UAE
    - cron: "17 10 * * *"   # 2:17 PM UAE
    - cron: "17 16 * * *"   # 8:17 PM UAE
  workflow_dispatch:

# Never run two updates at the same time.
concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get the project code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests python-dotenv groq mysql-connector-python certifi

      # TEMPORARY CHECK
      # Shows whether the AI keys look right (without printing them)
      # and whether GitHub can reach Groq. Can be removed once the
      # news step works.
      - name: Check AI keys and Groq connection
        env:
          LocationInferenceAPI: ${{ secrets.LOCATION_INFERENCE_API }}
          CategoryClassificationAPI: ${{ secrets.CATEGORY_CLASSIFICATION_API }}
          GeocodingAPI2: ${{ secrets.GEOCODING_API2 }}
        run: |
          python - <<'EOF'
          import os
          import httpx
          from groq import Groq

          # Check each key without printing it.
          for name in ["LocationInferenceAPI", "CategoryClassificationAPI", "GeocodingAPI2"]:
              key = os.getenv(name) or ""
              print(
                  name,
                  "| length:", len(key),
                  "| starts with gsk_:", key.startswith("gsk_"),
                  "| extra spaces or new lines:", key != key.strip(),
                  "| quotes:", '"' in key or "'" in key,
              )

          # Can GitHub reach Groq?
          try:
              response = httpx.get("https://api.groq.com/openai/v1/models", timeout=20)
              print("Groq reachable, status:", response.status_code)
          except Exception as error:
              print("Groq NOT reachable:", repr(error))

          # Try a real AI call and show the full error if it fails.
          try:
              client = Groq(api_key=(os.getenv("LocationInferenceAPI") or "").strip())
              reply = client.chat.completions.create(
                  model="openai/gpt-oss-120b",
                  messages=[{"role": "user", "content": "Say OK"}],
                  max_tokens=20,
              )
              print("Groq AI call worked.")
          except Exception as error:
              print("Groq AI call failed:", repr(error))
              print("Real cause:", repr(error.__cause__))
          EOF

      - name: Retrieve, process and store new articles
        env:
          # The pipeline files import each other by name
          # (e.g. "from news_service import ..."), so Python is told
          # to look in the Services and backend folders.
          PYTHONPATH: ${{ github.workspace }}/system/backend/Services:${{ github.workspace }}/system/backend:${{ github.workspace }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          LocationInferenceAPI: ${{ secrets.LOCATION_INFERENCE_API }}
          CategoryClassificationAPI: ${{ secrets.CATEGORY_CLASSIFICATION_API }}
          GeocodingAPI2: ${{ secrets.GEOCODING_API2 }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
        run: python -m system.backend.Services.article_processing_service
